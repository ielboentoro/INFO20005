<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/cart.css">
    <script src=scripts/scripts.js></script>
</head>

<body>
    <header class="header-container" id="headerCont"></header>
    
    <section class="page-top">
        <div class="subsite-header-spacer"></div>

        <div class="subsite-header-container">
            <p class="subsite-header">Cart</p>
        </div>

        <div class="subsite-header-spacer"></div>
    </section>

    <section class="page-content">
        <section class="cart-content">
            <div class="content" id="cartContent">
                
            </div>

            <div class="menu">
                <br>
                <div class="checkout-summary">
                    <div class="price">
                        <b>Total Price</b>
                        <br>
                        <b class="price-text" id="totalPrice">$0.00</b>
                    </div>

                    <div class="itemCount">
                        <b id="totalQty">0 Items</b>
                    </div>
                    <div class="buttonContainer">
                        <button class="checkout-button" onclick="goCheckout()">Checkout</button>
                    </div>
                </div>
            </div>

            <div class="description">
               
            </div>
        </section>
    </section>

    <footer class="footer">
        <p class="section-header sub2">Our Socials</p>
        <p class="section-header sub3">0466 XXX XXX</p>
        <p class="section-header sub3">@disciplecoffee</p>
        <p class="section-header sub2">(c) 2026 Disciple Coffee Roasters</p>
    </footer>
</body>
</html>
