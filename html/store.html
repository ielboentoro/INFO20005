<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/store.css">
    <script src="scripts/scripts.js"></script>
</head>

<body onload="initProductPage(); initFilters(); insertHeader()">
    <div class="header-container" id="headerCont"></div>
    
    <div class="page-top">
        <div class="subsite-header-spacer"></div>

        <div class="subsite-header-container">
            <p class="subsite-header">Store</p>
        </div>

        <div class="subsite-header-spacer"></div>
    </div>

    <section class="page-content">
        <section class="store-content">
            <div class="menu">
                <section class="filter-container">
                    <a class="filter-text header2">Filter Items</a>
                    <br>

                    <a class="filter-text header">Search</a>
                    <input type="text" id="query" name="query"><br><br>
                    <a class="filter-text header">Roast Strength</a>
                    <a><input type="checkbox" name="strengthStrong">Strong</a>
                    <a><input type="checkbox" name="strengthMild">Mild</a>
                    <a><input type="checkbox" name="strengthWeak">Weak</a>
                    <br>
                    
                    <a class="filter-text header">Blend Type</a>
                    <a><input type="checkbox" name="filterType">Filter</a>
                    <a><input type="checkbox" name="espressoType">Espresso</a>
                </section>
            </div>

            <div class="content" id="product-view">
                
            </div>
        </section>
    </section>

    <div class="footer">
        <p class="section-header sub2">Our Socials</p>
        <p class="section-header sub3">0466 XXX XXX</p>
        <p class="section-header sub3">@disciplecoffee</p>
        <p class="section-header sub2">(c) 2026 Disciple Coffee Roasters</p>
    </div>
</body>
</html>
