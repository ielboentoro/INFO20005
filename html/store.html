<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <script src="scripts/scripts.js"></script>
</head>

<body onload="initProductPage(); initFilters(); insertHeader()">
    <div class="header-container" id="headerCont">
      
    </div>
    
    <div class="page-top">
        <div class="subsite-header-spacer"></div>

        <div class="subsite-header-container">
            <p class="subsite-header">Store</p>
        </div>

        <div class="subsite-header-spacer"></div>
    </div>

    <section class="page-content">
        <section class="store-content">
            <div class="menu">
                <a>Roast Strength</a>
                <br>
                <input type="checkbox" name="strengthStrong">Strong
                <br>
                <input type="checkbox" name="strengthMild">Mild
                <br>
                <input type="checkbox" name="strengthWeak">Weak
                
                <br>
                <br>

                <a>Blend Type</a>
                <br>
                <input type="checkbox" name="filterType">Filter
                <br>
                <input type="checkbox" name="espressoType">Espresso
                <br>
            </div>

            <div class="content" id="product-view">
                
            </div>
        </section>
    </section>

    <div class="footer">
        <p class="section-header sub2">Our Socials</p>
        <p class="section-header sub3">0466 XXX XXX</p>
        <p class="section-header sub3">@disciplecoffee</p>
        <p class="section-header sub2">(c) 2026 Disciple Coffee Roasters</p>
    </div>
</body>
</html>
