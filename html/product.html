<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Title</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/product.css">
    <script src="scripts/scripts.js"></script>
</head>

<body>
    <header class="header-container" id="headerCont"></header>
    
    <section class="page-top">
        <div class="subsite-header-spacer"></div>

        <div class="subsite-header-container">
            <p class="subsite-header" id="product-title"></p>
        </div>

        <div class="subsite-header-spacer"></div>
    </section>

    <section class="page-content">
        <section class="product-content">
            <div class="content">
                <image class="product-image" alt="product-image" width="100%" id="prodImage" src=""></image>
            </div>

            <div class="menu">
                <section class="product-summary">
                    <div class="options">
                        <b>Weight Options</b>
                        <br>

                        <div class="options-container">
                            <button class="options-button" id="250g" name="0">250g</button>
                            <button class="options-button" id="500g" name="1">500g</button>
                            <button class="options-button" id="1kg" name="2">1kg</button>
                        </div>

                        <br>
                        <b>Grind Options</b>
                        <br>

                        <div class="options-container">
                            <button class="options-button" id="grind-espresso" name="0">Espresso</button>
                            <button class="options-button" id="grind-filter" name="1">Filter</button>
                            <button class="options-button" id="whole" name="2">Whole Beans</button>
                        </div>

                        <br>
                        <b>Quantity</b>
                        <br>

                        <div class="options-container">
                            <button class="qty-button" onclick="addQtyProduct()">+</button>
                            <a class="cart-quantity" id="quantity">0</a>
                            <button class="qty-button" onclick="deleteQtyProduct()">-</button>
                        </div>
                    </div>

                    <div class="price">
                        <b>Price</b>
                        <br>
                        <a class="price-text" id="product-price">$0.00</a>
                    </div>

                    <div class="itemCount">
                        <br>
                        <b id="variant-weight"></b>
                        <b id="variant-grind"></b>
                    </div>

                    <div class="buttonContainer">
                        <button onclick="addToCart(productData)" class="cart-button">Add to Cart</button>
                    </div>
                </section>
            </div>

            <div class="description">
                <a class="section-header product-description">
                    Description
                </a>
                <br>
                <br>
                <a class="product-description" id="description"></a>
            </div>
        </section>
    </section>

    <footer class="footer">
        <p class="section-header sub2">Our Socials</p>
        <p class="section-header sub3">0466 XXX XXX</p>
        <p class="section-header sub3">@disciplecoffee</p>
        <p class="section-header sub2">(c) 2026 Disciple Coffee Roasters</p>
    </footer>
</body>
</html>
