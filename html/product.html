<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Title</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/product.css">
    <script src="scripts/scripts.js"></script>
</head>

<body>
    <div class="header-container" id="headerCont">

    </div>
    
    <div class="page-top">
        <div class="subsite-header-spacer"></div>

        <div class="subsite-header-container">
            <p class="subsite-header" id="product-title"></p>
        </div>

        <div class="subsite-header-spacer"></div>
    </div>

    <section class="page-content">
        <section class="product-content">
            <div class="content">
                <image class="product-image" alt="product-image" width="100%" id="prodImage" src=""></image>
            </div>

            <div class="menu">
                <section class="product-summary">
                    <div class="price">
                        <b>Price</b>
                        <br>
                        <a class="price-text" id="product-price">$0.00</a>
                    </div>

                    <div class="itemCount">
                        <br>
                        <b id="variant-weight">250g</b>
                        <b id="variant-grind">Whole Beans</b>
                    </div>

                    <div class="buttonContainer">
                        <button onclick="addToCart(productData)" class="cart-button">Add to Cart</button>
                    </div>
                </section>
            </div>

            <div class="description">
                <a class="section-header product-description">
                    Description
                </a>
                <br>
                <br>
                <a class="product-description" id="description"></a>
            </div>
        </section>
    </section>

    <div class="footer">
        <p class="section-header sub2">Our Socials</p>
        <p class="section-header sub3">0466 XXX XXX</p>
        <p class="section-header sub3">@disciplecoffee</p>
        <p class="section-header sub2">(c) 2026 Disciple Coffee Roasters</p>
    </div>
</body>
</html>
